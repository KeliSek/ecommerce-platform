{% extends 'core/base.html' %}
{% block content %}
<div class="container-fluid py-5" style="margin-top: 110px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0 text-center">
                    <div class="card-body p-5">
                        <div class="mb-4">
                            <span
                                class="badge bg-success-subtle text-success-emphasis border border-success-subtle px-3 py-2 mb-3">
                                <i class="bi bi-check-circle-fill me-2"></i>Order Confirmed
                            </span>
                            <h1 class="h2 mb-3">Thank you for your order!</h1>
                            <p class="text-muted mb-0">Your order has been placed successfully and is now being
                                processed.</p>
                            <a href="{% url 'payments:initiate_payment' order.id %}" class="btn btn-success">Pay Now</a>
                        </div>

                        <div class="row g-3 text-start mb-4">
                            <div class="col-md-6">
                                <div class="bg-light rounded p-3 h-100">
                                    <small class="text-muted d-block">Order Number</small>
                                    <strong>{{ order.order_number }}</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="bg-light rounded p-3 h-100">
                                    <small class="text-muted d-block">Total</small>
                                    <strong>GH₵{{ order.get_total_cost }}</strong>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">

                            <a href="{% url 'orders:order_list' %}" class="btn btn-primary">View My Orders</a>
                            <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary">Continue
                                Shopping</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
