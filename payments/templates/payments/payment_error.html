{% extends "core/base.html" %}

{% block content %}
<div class="status-page">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="status-icon status-icon-danger mx-auto mb-3" aria-hidden="true"><i class="bi bi-exclamation-lg"></i></div>
            <h1 class="h2 mb-3">Payment failed</h1>
            <p class="text-muted mb-4">
                {% if error %}
                {{ error }}
                {% else %}
                Something went wrong while processing your payment. No charge was completed.
                {% endif %}
            </p>

            <a href="{% url 'orders:order_list' %}" class="btn btn-outline-primary">Back to My Orders</a>
        </div>
    </div>
</div>
{% endblock %}
