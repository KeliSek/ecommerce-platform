{# dashboard/templates/dashboard/base_dashboard.html #}
{% extends 'core/base.html' %}
{% block content %}
<div class="dashboard-layout row gy-4">
    <div class="col-12 col-lg-3 col-xl-2">
        <div class="dashboard-mobile-heading d-lg-none d-flex align-items-center justify-content-between mb-2">
            <h1 class="h5 mb-0">Vendor dashboard</h1>
            <span class="text-muted small">Manage your store</span>
        </div>
        <nav class="dashboard-nav list-group" aria-label="Vendor dashboard navigation">
            <a href="{% url 'dashboard:index' %}"
                class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                <i class="bi bi-speedometer2" aria-hidden="true"></i> Overview
            </a>
            <a href="{% url 'dashboard:product_list' %}"
                class="list-group-item list-group-item-action {% if 'product' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-box-seam" aria-hidden="true"></i> Products
            </a>
            <a href="{% url 'dashboard:category_list' %}"
                class="list-group-item list-group-item-action {% if 'category' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-tags" aria-hidden="true"></i> Categories
            </a>
            <a href="{% url 'dashboard:order_list' %}"
                class="list-group-item list-group-item-action {% if 'order' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-receipt" aria-hidden="true"></i> Orders
            </a>
        </nav>
    </div>
    <div class="col-12 col-lg-9 col-xl-10 dashboard-content">
        {% block dashboard_content %}{% endblock %}
    </div>
</div>
{% endblock %}
