{# dashboard/templates/dashboard/category_form.html #}
{% extends 'dashboard/base_dashboard.html' %}
{% load crispy_forms_tags %}
{% block dashboard_content %}
<h1 class="h3 mb-4">
    <i class="bi bi-tags text-primary" aria-hidden="true"></i> {% if is_create %}Add category{% else %}Edit {{ category.name }}{% endif %}
</h1>
<div class="card dashboard-form-card border-0">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-3">{% if is_create %}Add category{% else %}Save changes{% endif %}</button>
        </form>
    </div>
</div>
{% endblock %}
